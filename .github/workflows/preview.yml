name: Build Preview
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7
